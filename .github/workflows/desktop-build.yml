name: Yetta Desktop Windows build and EXE release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "installer/**"
      - "Project/**"
      - "docs/**"
      - "README.md"
      - "local.json"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "installer/**"
      - "local.json"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

concurrency:
  group: yetta-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore src/Yetta.Desktop/Yetta.Desktop.csproj
      - name: Core smoke tests
        run: dotnet run --project tests/Yetta.Core.Smoke/Yetta.Core.Smoke.csproj --configuration Release
      - name: Updater feed smoke tests
        run: dotnet run --project tests/Yetta.Updater.Smoke/Yetta.Updater.Smoke.csproj --configuration Release
      - name: Compile desktop application
        run: dotnet build src/Yetta.Desktop/Yetta.Desktop.csproj --configuration Release --no-restore -warnaserror
      - name: Set up Python for the Marvine process test
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify desktop layout, profiles and Python
        shell: pwsh
        run: |
          $env:YETTA_SMOKE_PYTHON = (Get-Command python.exe).Source
          dotnet run --project tests/Yetta.Desktop.Smoke/Yetta.Desktop.Smoke.csproj --configuration Release
      - name: Upload warning layout previews
        uses: actions/upload-artifact@v4
        with:
          name: Yetta-warning-previews
          path: artifacts/ui-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Compile DAX tray companion
        run: dotnet build src/Yetta.DaxAgent/Yetta.DaxAgent.csproj --configuration Release -warnaserror
      - name: Publish DAX tray companion
        shell: pwsh
        run: |
          dotnet publish src/Yetta.DaxAgent/Yetta.DaxAgent.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None --output artifacts/tray
          if ($LASTEXITCODE -ne 0) { throw "DAX publish failed." }
          if (!(Test-Path "artifacts/tray/Yetta.DAX.exe")) { throw "DAX tray executable missing." }
      - name: Publish DAX Administrator service
        run: dotnet publish src/Yetta.DaxAdministrator/Yetta.DaxAdministrator.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -warnaserror -o artifacts/DaxAdministrator
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe was not installed." }

      - name: Build and exercise the DAX Administrator installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\DaxAdministrator.iss"
          if ($LASTEXITCODE -ne 0) { throw "DAX Administrator installer compilation failed." }
          $setup = Resolve-Path "artifacts/setup/YettaDaxAdministratorSetup.exe"
          $service = "YettaDaxAdministrator"
          $log = Join-Path $env:RUNNER_TEMP "dax-administrator-install.log"
          $installed = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$log`"" -Wait -PassThru
          if ($installed.ExitCode -ne 0) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "DAX Administrator install failed: $($installed.ExitCode)"
          }
          $uninstaller = Join-Path $env:ProgramFiles "Yetta DAX\unins000.exe"
          try {
            dotnet run --project tests/Yetta.Administrator.Smoke -c Release
            if ($LASTEXITCODE -ne 0) { throw "DAX Administrator smoke test failed." }
            Restart-Service -Name $service -ErrorAction Stop
            dotnet run --project tests/Yetta.Administrator.Smoke -c Release --no-build -- --revoked
            if ($LASTEXITCODE -ne 0) { throw "Revocation did not persist across restarts." }
          } finally {
            $uninstalled = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
            if ($uninstalled.ExitCode -ne 0) { throw "DAX Administrator uninstall failed: $($uninstalled.ExitCode)" }
          }
          dotnet run --project tests/Yetta.Administrator.Smoke -c Release --no-build -- --removed
          if ($LASTEXITCODE -ne 0) { throw "DAX Administrator removal test failed." }

      - name: Bundle desktop, tray, catalog and Administrator setup
        shell: pwsh
        run: |
          $helperHash = (Get-FileHash artifacts/setup/YettaDaxAdministratorSetup.exe).Hash
          dotnet publish src/Yetta.Desktop/Yetta.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:BundleDax=true "-p:DaxInstallerSha256=$helperHash" -o artifacts/portable
          if ($LASTEXITCODE -ne 0) { throw "Unified publish failed." }
          $release = New-Item -ItemType Directory -Path artifacts/release -Force
          $exe = (Copy-Item artifacts/portable/Yetta.exe $release -PassThru).FullName
          $verify = Start-Process $exe -ArgumentList '--verify-bundle' -WorkingDirectory $release.FullName -PassThru -Wait
          if ($verify.ExitCode -ne 0) { throw "Portable components were not available at startup: $($verify.ExitCode)" }
          $hash = (Get-FileHash $exe).Hash
          $bytes = (Get-Item $exe).Length
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          & $iscc "/DPayloadSHA=$hash" "/DPayloadBytes=$bytes" installer/Yetta.iss
          if ($LASTEXITCODE -ne 0) { throw "Web installer compilation failed." }
          $setup = (Copy-Item artifacts/setup/YettaInstaller.exe $release -PassThru).FullName
          $target = Join-Path $env:RUNNER_TEMP 'Yetta install test'
          $log = Join-Path $env:RUNNER_TEMP 'Yetta-setup.log'
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOLAUNCH=1 /DIR="{0}" /PAYLOAD="{1}" /LOG="{2}"' -f $target,$exe,$log
          $installed = Start-Process $setup -ArgumentList $arguments -Wait -PassThru
          if ($installed.ExitCode -ne 0) { Get-Content $log; throw "Web installer failed: $($installed.ExitCode)" }
          if ((Get-FileHash (Join-Path $target 'Yetta.exe')).Hash -ne $hash) { throw 'Installed executable mismatch.' }
          Copy-Item LICENSE $release

      - name: Upload build for QA
        uses: actions/upload-artifact@v4
        with:
          name: Yetta-0.6.0-preview-win-x64-QA
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish EXE to GitHub Releases
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Retrieve validated EXE
        uses: actions/download-artifact@v4
        with:
          name: Yetta-0.6.0-preview-win-x64-QA
          path: artifacts/release
      - name: Publish direct-download EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content 'src/Yetta.Desktop/Yetta.Desktop.csproj'
          $version = $project.Project.PropertyGroup.Version
          if (![string]$version -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid project version: $version" }
          $tag = "v$version-preview"
          $ErrorActionPreference = 'Continue'
          gh release view $tag --json tagName 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            Write-Host "Release $tag already exists; keeping published binaries immutable."
            exit 0
          }
          $notes = "docs/releases/v$version-preview.md"
          if (!(Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag 'artifacts/release/Yetta.exe' 'artifacts/release/YettaInstaller.exe#Yetta Installer' 'artifacts/release/LICENSE' --target $env:GITHUB_SHA --title "Yetta $version Preview" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }
