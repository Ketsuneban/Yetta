name: Yetta Desktop Windows build and EXE release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "installer/**"
      - "Project/**"
      - "docs/**"
      - "README.md"
      - "local.json"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

concurrency:
  group: yetta-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Download and verify OFL Inter font
        shell: pwsh
        run: ./scripts/prepare-fonts.ps1
      - name: Restore dependencies
        run: dotnet restore src/Yetta.Desktop/Yetta.Desktop.csproj
      - name: Core smoke tests
        run: dotnet run --project tests/Yetta.Core.Smoke/Yetta.Core.Smoke.csproj --configuration Release
      - name: Compile desktop application
        run: dotnet build src/Yetta.Desktop/Yetta.Desktop.csproj --configuration Release --no-restore -warnaserror
      - name: Publish portable single-file executable
        shell: pwsh
        run: |
          dotnet publish src/Yetta.Desktop/Yetta.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None --output artifacts/Yetta-win-x64
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }
          $exe = "artifacts/Yetta-win-x64/Yetta.exe"
          if (!(Test-Path $exe)) { throw "Yetta.exe is missing." }
          if (!(Test-Path "artifacts/Yetta-win-x64/local.json")) { throw "Shared local.json is missing." }
          $unexpected = @(Get-ChildItem "artifacts/Yetta-win-x64" -File | Where-Object { $_.Extension -eq ".dll" -or ($_.Extension -eq ".json" -and $_.Name -ne "local.json") })
          if ($unexpected.Count -gt 0) { throw "Unexpected runtime dependencies: $($unexpected.Name -join ', ')" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256  Yetta.exe  $hash" | Set-Content "artifacts/Yetta-win-x64/SHA256SUMS.txt" -Encoding ascii
          Get-Content "artifacts/Yetta-win-x64/SHA256SUMS.txt" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Compile DAX tray companion
        run: dotnet build src/Yetta.DaxAgent/Yetta.DaxAgent.csproj --configuration Release -warnaserror
      - name: Publish DAX tray companion
        shell: pwsh
        run: |
          dotnet publish src/Yetta.DaxAgent/Yetta.DaxAgent.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None --output artifacts/Yetta-win-x64
          if ($LASTEXITCODE -ne 0) { throw "DAX publish failed." }
          if (!(Test-Path "artifacts/Yetta-win-x64/Yetta.DAX.exe")) { throw "DAX tray executable missing." }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe was not installed." }

      - name: Build per-user YettaSetup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\Yetta.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $setup = "artifacts/setup/YettaSetup.exe"
          if (!(Test-Path $setup)) { throw "Installer output is missing." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256  YettaSetup.exe  $hash" | Set-Content "artifacts/setup/INSTALLER-SHA256.txt" -Encoding ascii
          New-Item -ItemType Directory -Force -Path "artifacts/release" | Out-Null
          Copy-Item "artifacts/Yetta-win-x64/Yetta.exe" "artifacts/release/Yetta.exe"
          Copy-Item "artifacts/Yetta-win-x64/Yetta.DAX.exe" "artifacts/release/Yetta.DAX.exe"
          Copy-Item "artifacts/Yetta-win-x64/local.json" "artifacts/release/local.json"
          Copy-Item "artifacts/Yetta-win-x64/SHA256SUMS.txt" "artifacts/release/SHA256SUMS.txt"
          Copy-Item $setup "artifacts/release/YettaSetup.exe"
          Copy-Item "artifacts/setup/INSTALLER-SHA256.txt" "artifacts/release/INSTALLER-SHA256.txt"

      - name: Upload build for QA
        uses: actions/upload-artifact@v4
        with:
          name: Yetta-0.3.20-preview-win-x64-QA
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish EXE to GitHub Releases
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Retrieve validated EXE
        uses: actions/download-artifact@v4
        with:
          name: Yetta-0.3.20-preview-win-x64-QA
          path: artifacts/release
      - name: Publish direct-download EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content 'src/Yetta.Desktop/Yetta.Desktop.csproj'
          $version = $project.Project.PropertyGroup.Version
          if (![string]$version -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid project version: $version" }
          $tag = "v$version-preview"
          $ErrorActionPreference = 'Continue'
          gh release view $tag --json tagName 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            Write-Host "Release $tag already exists; keeping published binaries immutable."
            exit 0
          }
          $notes = "docs/releases/v$version-preview.md"
          if (!(Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag 'artifacts/release/local.json' 'artifacts/release/Yetta.DAX.exe' 'artifacts/release/Yetta.exe' 'artifacts/release/SHA256SUMS.txt' 'artifacts/release/YettaSetup.exe' 'artifacts/release/INSTALLER-SHA256.txt' 'LICENSE' 'src/Yetta.Desktop/Assets/OFL-Inter.txt' --target $env:GITHUB_SHA --title "Yetta $version Preview" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }
