name: Yetta Desktop Windows build
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Project/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Project/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yetta-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 preview
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Yetta.Desktop/Yetta.Desktop.csproj

      - name: Run Core smoke tests
        run: dotnet run --project tests/Yetta.Core.Smoke/Yetta.Core.Smoke.csproj --configuration Release

      - name: Build desktop app
        run: dotnet build src/Yetta.Desktop/Yetta.Desktop.csproj --configuration Release --no-restore -warnaserror

      - name: Publish self-contained Windows x64 preview
        run: >
          dotnet publish src/Yetta.Desktop/Yetta.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output artifacts/Yetta-win-x64

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $exe = "artifacts/Yetta-win-x64/Yetta.exe"
          if (!(Test-Path $exe)) { throw "Yetta.exe was not produced." }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256  Yetta.exe  $hash" | Set-Content "artifacts/Yetta-win-x64/SHA256SUMS.txt" -Encoding ascii
          Get-Content "artifacts/Yetta-win-x64/SHA256SUMS.txt" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows preview files
        uses: actions/upload-artifact@v4
        with:
          name: Yetta-0.1.0-preview-win-x64
          path: artifacts/Yetta-win-x64/
          if-no-files-found: error
          retention-days: 30
