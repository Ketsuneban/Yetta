name: Site validation

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/site-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/site-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JavaScript syntax
        run: node --check site/app.js

      - name: Validate HTML and local assets
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import sys

          root = Path("site")
          page = root / "index.html"

          class SiteParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.errors = []
                  self.local_refs = []
                  self.html_seen = False
                  self.body_seen = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "html":
                      self.html_seen = True
                  if tag == "body":
                      self.body_seen = True
                  for key in ("src", "href"):
                      value = attrs.get(key)
                      if not value:
                          continue
                      parts = urlsplit(value)
                      if parts.scheme or value.startswith(("#", "mailto:", "tel:")):
                          continue
                      path = parts.path
                      if not path:
                          continue
                      if path.startswith("/"):
                          path = path[1:]
                      self.local_refs.append(root / path)

          parser = SiteParser()
          parser.feed(page.read_text(encoding="utf-8"))
          parser.close()
          missing = [str(path) for path in parser.local_refs if not path.is_file()]
          if not parser.html_seen or not parser.body_seen:
              print("HTML document is missing html/body structure")
              sys.exit(1)
          if missing:
              print("Missing local assets:")
              print("\n".join(missing))
              sys.exit(1)
          print(f"HTML structure OK; checked {len(parser.local_refs)} local references.")
          PY

      - name: Validate project JSON files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK: {path}")
          PY